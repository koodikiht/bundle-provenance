name: Release and SLSA Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run test suite
        run: bun test
      - name: Compile standalone binaries
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/bundle-provenance-linux-x64
          bun build --compile --target=bun-linux-arm64 src/cli.ts --outfile dist/bundle-provenance-linux-arm64
          bun build --compile --target=bun-darwin-arm64 src/cli.ts --outfile dist/bundle-provenance-darwin-arm64
          bun build --compile --target=bun-darwin-x64 src/cli.ts --outfile dist/bundle-provenance-darwin-x64
          cd dist && sha256sum bundle-provenance-* > SHA256SUMS
      - name: Generate SLSA Build Level 3 provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/bundle-provenance-*"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > /tmp/notes.md
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          else
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
